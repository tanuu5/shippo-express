<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Model Viewer (dev)</title>
<style>
  html, body { margin: 0; height: 100%; background: #afafb4; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; }
  #ui { position: fixed; left: 8px; top: 8px; z-index: 2; display: flex; flex-wrap: wrap; gap: 4px; max-width: 520px; }
  #ui button { padding: 4px 8px; border: 1px solid #0003; border-radius: 6px; background: #fff; cursor: pointer; }
  #ui button.on { background: #7f6867; color: #fff; }
  #info { position: fixed; left: 8px; bottom: 8px; color: #222; white-space: pre; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="ui"></div>
<div id="info"></div>
<script type="module" src="./model.js"></script>
</body>
</html>
